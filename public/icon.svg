<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ascendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Emblem Rounded Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ascendGradient)" filter="url(#subtleShadow)"/>
  
  <!-- Subtle Glass Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Ascending Chevron / Summit Peak (Crisp White) -->
  <path d="M18 42L32 18L46 42" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Cross Beam / Energy Link -->
  <path d="M25 33H39" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9"/>
  
  <!-- Glowing Apex Spark Node -->
  <circle cx="32" cy="18" r="3.5" fill="#FFFFFF"/>
</svg>

<svg width="200" height="56" viewBox="0 0 200 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ascendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Squircle Badge -->
  <rect x="2" y="4" width="48" height="48" rx="14" fill="url(#ascendGrad)" filter="url(#badgeShadow)"/>
  
  <!-- Crisp White "A" Emblem with Rounded Caps -->
  <path d="M19 36L26 18L33 36" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21.5 30H30.5" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Bold ASCEND Wordmark in Dark Charcoal / Black -->
  <text x="64" y="37" font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-weight="900" font-size="26" letter-spacing="2" fill="#18181B">ASCEND</text>

  <!-- Blue-Purple Gradient Accent Dot -->
  <circle cx="186" cy="22" r="4.5" fill="url(#ascendGrad)"/>
</svg>
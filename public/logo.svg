<svg width="620" height="160" viewBox="0 0 620 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hexFillW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="hexStrokeW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="ascentLineW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="nodeGlowW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="underlineW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glowW" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(0,0)">
    <polygon points="80,10 140,45 140,115 80,150 20,115 20,45"
             fill="url(#hexFillW)" stroke="url(#hexStrokeW)" stroke-width="2.5"/>
    <polygon points="80,22 129,50 129,110 80,138 31,110 31,50"
             fill="none" stroke="#22D3EE" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="44" y="118" width="6" height="10" rx="1.5" fill="#22D3EE" opacity="0.5"/>
    <rect x="54" y="112" width="6" height="16" rx="1.5" fill="#22D3EE" opacity="0.7"/>
    <rect x="64" y="105" width="6" height="23" rx="1.5" fill="#22D3EE" opacity="0.9"/>
    <g filter="url(#glowW)">
      <path d="M46 112 L80 46 L114 112" fill="none" stroke="url(#ascentLineW)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 84 L98 84" fill="none" stroke="url(#ascentLineW)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    </g>
    <circle cx="80" cy="46" r="13" fill="url(#nodeGlowW)"/>
    <circle cx="80" cy="46" r="5" fill="#F8FAFC"/>
  </g>

  <text x="172" y="103" font-family="'Chakra Petch','Orbitron',sans-serif" font-weight="700" font-size="54" letter-spacing="4" fill="#F8FAFC">ASCEND</text>
  <rect x="174" y="116" width="380" height="4" rx="2" fill="url(#underlineW)"/>
</svg>
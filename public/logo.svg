<svg width="240" height="64" viewBox="0 0 240 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7C3AED" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (38x38 inside 64px height) -->
  <g transform="translate(4, 13)">
    <rect width="38" height="38" rx="10" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
    <rect x="0.5" y="0.5" width="37" height="37" rx="9.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Ascending Peak -->
    <path d="M11 27L19 11L27 27" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 21H23" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.9"/>
    <circle cx="19" cy="11" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- ASCEND Wordmark in bold, crisp dark text -->
  <text x="54" y="39" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="2.5" fill="#1D1D1F">ASCEND</text>

  <!-- Small accent badge dot -->
  <circle cx="188" cy="27" r="3" fill="url(#logoGrad)"/>
</svg>
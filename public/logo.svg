<svg width="620" height="160" viewBox="0 0 620 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexFill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#2A2421"/>
    </linearGradient>
    <linearGradient id="ascentLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8552A"/>
      <stop offset="100%" stop-color="#FF7A50"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(10,5)">
    <!-- Outer Hexagon Frame -->
    <polygon points="80,10 140,45 140,115 80,150 20,115 20,45"
             fill="url(#hexFill)" stroke="#141110" stroke-width="4"/>
    <polygon points="80,22 129,50 129,110 80,138 31,110 31,50"
             fill="none" stroke="#E8552A" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 2"/>
    
    <!-- Ascending Peak Chevron -->
    <path d="M46 112 L80 46 L114 112" fill="none" stroke="url(#ascentLine)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 84 L98 84" fill="none" stroke="#E8552A" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Golden Apex Glow Node -->
    <circle cx="80" cy="46" r="12" fill="url(#nodeGlow)"/>
    <circle cx="80" cy="46" r="5" fill="#C9A227"/>
  </g>

  <!-- High-contrast Brand Text (#141110 near-black) -->
  <text x="175" y="102" font-family="Oswald, 'Chakra Petch', -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="6" fill="#141110">ASCEND</text>
  <rect x="177" y="116" width="380" height="5" rx="2.5" fill="#E8552A"/>
</svg>